[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cabina"
version = "0.1.0"
description = "Control plane for a Claude Code environment: agents, skills, harness and docs under one contract, with health checks. Never acts on its own."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Danny Sandi Molina" }]
keywords = ["claude-code", "agents", "developer-portal", "control-plane"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
cabina = "cabina.cli:main"

[project.urls]
Homepage = "https://github.com/dsandimolina/cabina"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cabina = ["static/*.html"]
