<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabina</title>
<style>
:root{--bg:#F6F7F3;--panel:#FFFFFF;--ink:#1B1F19;--dim:#697064;--line:#DCDFD6;--hover:#EEF0EA;--moss:#3D5A3A;--moss-soft:#E4ECDF;--amber:#8A6A1E;--amber-soft:#F3EAD3;--rust:#8E3F31;--rust-soft:#F5E1DC;--slate:#3E5872;--slate-soft:#E1E8EF;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;--sans:-apple-system,'Segoe UI','Helvetica Neue',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#161815;--panel:#1E211C;--ink:#E7E9E2;--dim:#9AA094;--line:#2D312A;--hover:#252923;--moss:#9FC195;--moss-soft:#243020;--amber:#D8B45C;--amber-soft:#332C18;--rust:#E08D7C;--rust-soft:#3A241F;--slate:#8FB0CF;--slate-soft:#1F2A35}}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--moss);outline-offset:1px}code{font-family:var(--mono);font-size:.93em}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.top .t{font-weight:600;font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:12px;padding:6px 10px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--dim)}.stat b{font-weight:600;color:var(--ink)}.stat.ok b{color:var(--moss)}.stat.warn b{color:var(--amber)}.stat.bad b{color:var(--rust)}
.tabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}.tab{background:none;border:1px solid transparent;border-bottom:none;padding:8px 13px;border-radius:7px 7px 0 0;color:var(--dim);white-space:nowrap;font-size:13.5px}.tab.on{color:var(--ink);background:var(--bg);border-color:var(--line);margin-bottom:-1px}
.main{flex:1;display:grid;grid-template-columns:minmax(320px,1.1fr) minmax(300px,1fr);min-height:0}@media (max-width:760px){.main{grid-template-columns:1fr}.detail{border-top:1px solid var(--line)}}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}@media (max-width:760px){.list{border-right:none}}
.filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}.filters input{flex:1;min-width:140px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim)}.chip.on{background:var(--moss-soft);color:var(--moss);border-color:transparent}
.rows{overflow-y:auto;flex:1}.row{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink)}.row:hover{background:var(--hover)}.row.sel{background:var(--hover);box-shadow:inset 3px 0 0 var(--moss)}.row.focus .n{color:var(--moss);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%}.d-valid,.d-done,.d-ok,.d-complete{background:var(--moss)}.d-warnings,.d-working,.d-partial{background:var(--amber)}.d-invalid,.d-bad{background:var(--rust)}.d-document,.d-idle,.d-none,.d-unknown{background:var(--line)}
.row .n{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .w{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grp{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);background:var(--bg);display:flex;justify-content:space-between}
.empty{padding:28px 18px;color:var(--dim);font-size:13px}.foot{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.detail{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}.detail .h{font-family:var(--mono);font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;font-family:var(--sans);font-weight:500}.p-valid,.p-ok,.p-complete{background:var(--moss-soft);color:var(--moss)}.p-warnings,.p-partial{background:var(--amber-soft);color:var(--amber)}.p-invalid,.p-bad{background:var(--rust-soft);color:var(--rust)}.p-document,.p-none{background:var(--line);color:var(--dim)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;color:var(--dim)}.meta b{color:var(--ink);font-weight:500;word-break:break-word}
.box{font-size:13px;padding:10px 12px;border-radius:8px}.box.warn{background:var(--amber-soft);color:var(--amber)}.box.bad{background:var(--rust-soft);color:var(--rust)}.box.info{background:var(--slate-soft);color:var(--slate)}.box ul{margin:4px 0 0 16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}.btn{font-size:13px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.btn:hover{background:var(--hover)}.btn.primary{background:var(--moss);color:#fff;border-color:var(--moss)}.btn.danger{color:var(--rust);border-color:var(--rust-soft)}.btn[disabled]{opacity:.5;cursor:default}
.muted{color:var(--dim);font-size:13px}.tl{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--slate-soft);color:var(--slate);font-family:var(--sans);margin-left:6px;vertical-align:middle}.tl.codex{background:var(--amber-soft);color:var(--amber)}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:12.5px;color:var(--dim)}.form .err{color:var(--rust);font-size:12px;min-height:14px}
textarea{min-height:90px;resize:vertical;font-family:var(--mono);font-size:12.5px}textarea.editor{width:100%;min-height:52vh;line-height:1.5;tab-size:2}
pre.doc,pre.preview{font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:60vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}.toast.show{opacity:1}@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head>

async function openDoc(key){if(S.editing&&!confirm(T("discard")))return;S.editing=false;S.sel=key;renderDocs();const [project,rel]=key.split("::");$("detail").innerHTML=`<div class="muted">${T("loading")}</div>`;
 const r=await GET(`/api/doc?project=${encodeURIComponent(project)}&rel=${encodeURIComponent(rel)}`);if(!r.ok){$("detail").innerHTML=`<div class="box bad">${esc(r.message)}</div>`;return;}S.doc={project,rel,...r};renderDocRead();}
function renderDocRead(){const d=S.doc;if(!d)return;$("detail").innerHTML=`<div class="h">${esc(d.rel.split("/").pop())} <span class="pill p-document">${esc(d.project)}</span></div><div class="meta"><span>${T("path")}</span><b><code>${esc(d.path)}</code></b><span>${T("modified")}</span><b>${esc(d.mtime)} · ${d.days===0?T("today"):d.days+" "+T("days")}${d.days>30?` <span style="color:var(--amber)">${T("maybeStale")}</span>`:""}</b><span>${T("size")}</span><b>${d.content.split("\n").length} ${T("lines")}</b></div>`+
 (d.blocked?`<div class="box warn">${T("blockedMsg",{p:esc(d.project)})}</div>`:"")+`<pre class="doc">${esc(d.content)}</pre><div class="actions"><button class="btn primary" id="bEdit" ${d.blocked?"disabled":""}>${T("edit")}</button><button class="btn" id="bExt">${T("openExt")}</button><button class="btn" id="bReload">${T("reload")}</button></div>`;
 $("bEdit").onclick=()=>renderDocEdit();$("bExt").onclick=async()=>{toast((await POST("/api/open",{path:d.path})).message);};$("bReload").onclick=()=>openDoc(S.sel);}
function renderDocEdit(){const d=S.doc;S.editing=true;$("detail").innerHTML=`<div class="h">${esc(d.rel.split("/").pop())} <span class="pill p-warnings">${T("editing")}</span></div><div class="muted">${T("editHint")}</div><textarea class="editor" id="ta" spellcheck="false">${esc(d.content)}</textarea><div id="msg"></div><div id="cbDoc"></div><div class="actions"><button class="btn primary" id="bSave">${T("save")}</button><button class="btn" id="bCancel">${T("cancel")}</button></div>`;commitBox("cbDoc",d.path);
 $("bCancel").onclick=()=>{S.editing=false;renderDocRead();};$("bSave").onclick=async()=>{const nv=$("ta").value;if(nv===d.content){toast(T("noChanges"));S.editing=false;renderDocRead();return;}$("bSave").disabled=true;$("bSave").textContent=T("saving");
  const r=await POST("/api/save-doc",{project:d.project,rel:d.rel,content:nv,hash:d.hash});if(r.ok){toast(r.message);await maybeCommit("cbDoc",d.path,`cabina: edit ${d.rel} (${d.project})`);S.editing=false;await loadDocs();openDoc(S.sel);}else{$("bSave").disabled=false;$("bSave").textContent=T("save");$("msg").innerHTML=`<div class="box bad">${esc(r.message)}${r.conflict?` <button class="btn" id="bSee" style="margin-left:8px">${T("seeCurrent")}</button>`:""}</div>`;if(r.conflict)$("bSee").onclick=()=>{if(confirm(T("loseEdit"))){S.editing=false;openDoc(S.sel);}};}};}
// ---------- LIVE ----------
function renderLive(){const l=S.live;$("filters").innerHTML=`<span class="muted">${l&&l.ok?T("liveHint",{p:l.provider}):T("noLive")}</span>`;
 if(!l||!l.ok){$("rows").innerHTML=`<div class="empty">${esc(l?.reason||T("noLive"))}</div>`;$("foot").textContent="";$("detail").innerHTML=`<div class="muted">${T("noLive")}</div>`;return;}const ico={working:"●",done:"✓",idle:"○"};
 $("rows").innerHTML=l.agents.length?l.agents.map(a=>`<button class="row" data-p="${esc(a.pane)}"><span class="dot d-${a.status}"></span><span class="n">${esc(a.agent)} <span class="muted">${esc(a.workspace)}</span></span><span class="w">${esc(a.task||"—")}</span></button>`).join(""):`<div class="empty">${T("noAgents")}</div>`;
 document.querySelectorAll(".row").forEach(r=>r.onclick=async()=>{toast((await POST("/api/focus",{pane:r.dataset.p})).message);});const c={};l.agents.forEach(a=>c[a.status]=(c[a.status]||0)+1);
 $("foot").textContent=T("inWs",{n:l.agents.length,w:l.workspaces.length})+" · "+Object.entries(c).map(([k,v])=>`${ico[k]||"·"} ${v} ${T(k)}`).join("  ");const done=l.agents.filter(a=>a.status==="done");
 $("detail").innerHTML=done.length?`<div class="h">${T("waitReview")}</div>`+done.map(a=>`<div class="box warn"><b>${esc(a.agent)}</b> · ${esc(a.workspace)}<br>${esc(a.task||"—")}</div>`).join(""):`<div class="muted">${T("noneDone")}</div>`;}
loadAgents();loadSkills();loadProjs();loadHar();loadActivity();loadHub();
if(!HUB){loadLive();loadDocs();setInterval(loadLive,1000);}
</script></body></html>
