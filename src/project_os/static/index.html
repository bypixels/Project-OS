<!--
THESIS: an honest measurement console; refuses the decorated-template arrangement — hierarchy comes from type weight, spacing and status color used ONLY for state.
OWN-WORLD: near-monochrome neutrals (paper white / near-black, cool grays), one working accent (blue) for interaction, moss/amber/rust reserved for measured state; system font stack + tabular numerals; hairline borders, 6px radii, no shadows heavier than 1dp.
STORY: the operator sees at a glance what is healthy, digs into any row, reads evidence, acts via generated commands.
FIRST VIEWPORT: slim top bar (product name, global stats, rescan); grouped sidebar nav (Estado: health/live/activity · Catálogo: agents/skills · Proyectos: projects/docs · Sistema: harness/mcp); list+detail two-pane content.
FORM: category canon — the user's standing exit, chosen on the decision page (question d45111fd) after the seeded direction round (key po-seed-001; roll not persisted)
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// wbr() and evidenceHtml() both take ALREADY-ESCAPED text and only add markup of their own; they
// are always called as wbr(esc(x)) / evidenceHtml(esc(x)) so escaping still happens at the sink.
// wbr: paths break after a separator instead of mid-token ("documentati/on-updater.md").
const wbr=s=>String(s).replace(/\//g,"/<wbr>");
// evidenceHtml: a finding's detail mixes prose sentences with measured lines (paths, sizes, days).
// Prose reads as prose (--sans); only the measured lines stay monospaced, and they scroll sideways
// instead of wrapping. Monospace is for measurement here, never a costume for "technical".
const isMeasuredLine=t=>!!t&&(t.includes("/")||!/\s/.test(t)||/\d+(\.\d+)?\s*(B|KB|MB|GB|k|%|d|days|d[ií]as|lines|l[ií]neas)\b/.test(t));
function evidenceHtml(escaped){const lines=String(escaped).split("\n");const out=[];let buf=[],mode=null;
 const flush=()=>{if(!buf.length)return;out.push(mode==="m"?`<pre class="lines">${buf.join("\n")}</pre>`:`<div class="prose">${buf.join("<br>")}</div>`);buf=[];};
 for(const l of lines){const t=l.trim();if(!t){flush();mode=null;continue;}
  const m=isMeasuredLine(t)?"m":"p";if(m!==mode){flush();mode=m;}buf.push(l);}
 flush();return `<div class="ev">${out.join("")}</div>`;}

function relTime(iso){if(!iso)return null;const t=new Date(iso).getTime();if(isNaN(t))return null;const s=Math.max(0,Math.floor((Date.now()-t)/1000));
 if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d";}
function fmtDT(iso){const t=new Date(iso);if(isNaN(t))return iso;const p=n=>String(n).padStart(2,"0");return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`;}
function renderStats(){const a=S.data?.agents||[],l=S.live?.agents||[];const n=k=>a.filter(x=>x.category===k).length;const w=l.filter(x=>x.status==="working").length,d=l.filter(x=>x.status==="done").length;
 let scanStat="";if(!HUB&&S.scanStatus){if(S.scanStatus.scanning)scanStat=`<span class="stat" id="scanStat">${esc(T("scanning"))}</span>`;
  else{const rt=relTime(S.scanStatus.scanned_at);if(rt)scanStat=`<span class="stat" id="scanStat">${esc(T("scanAgo",{t:rt}))}</span>`;}}
 $("stats").innerHTML=`<span class="stat"><b>${w}</b> ${T("working")}</span>`+(d?`<span class="stat warn"><b>${d}</b> ${T("done")}</span>`:"")+`<span class="stat ok"><b>${n("valid")}</b> ${T("ok")}</span>`+(n("warnings")?`<span class="stat warn"><b>${n("warnings")}</b> ${T("warnings")}</span>`:"")+(n("invalid")?`<span class="stat bad"><b>${n("invalid")}</b> ${T("invalid")}</span>`:"")+scanStat;}

function actTimeline(sessions){const days=14;const today=new Date();today.setHours(0,0,0,0);const buckets=Array(days).fill(0);

 const max=Math.max(1,...buckets),w=140,h=28,bw=w/days;
 const bars=buckets.map((v,i)=>{const bh=Math.round((v/max)*h);return `<rect x="${i*bw+1}" y="${h-bh}" width="${bw-2}" height="${Math.max(bh,1)}" rx="1"></rect>`;}).join("");
 return `<svg width="${w}" height="${h}" style="color:var(--moss);fill:currentColor;vertical-align:middle" role="img" aria-label="14-day session count">${bars}</svg>`;}

 $("detail").innerHTML=`<div class="h">${esc(cur.name)} <span class="pill p-${cls[cur.status]||"document"}">${esc(cur.status)}</span></div><div class="meta"><span>${T("mcpTarget")}</span><b><code>${wbr(esc(cur.target))}</code></b></div><div class="box info" style="margin-top:6px">${esc(cur.detail)}</div>`;}
// ---------- DOCS ----------
function renderDocs(){if(!S.docs){$("rows").innerHTML=`<div class="empty">${T("loading")}</div>`;$("filters").innerHTML="";return;}const a=S.docs.docs,work=new Set(S.docs.working);
 const chips=[["old",T("older")],["mem",T("memHar")],["claude",T("claudeMd")]];$("filters").innerHTML=`<input id="q" placeholder="${T("search")}" value="${esc(S.q)}">`+chips.map(([k,l])=>`<button class="chip ${S.chips.has(k)?"on":""}" data-c="${k}">${l}</button>`).join("")+chipFocus();bindFocus();
 $("q").oninput=e=>{S.q=e.target.value;renderDocs();};document.querySelectorAll(".chip[data-c]").forEach(c=>c.onclick=()=>{const k=c.dataset.c;S.chips.has(k)?S.chips.delete(k):S.chips.add(k);renderDocs();});
 const q=S.q.toLowerCase();let sel=a.filter(x=>{if(S.focus&&x.project!==S.focus)return false;if(q&&!(x.rel+" "+x.project).toLowerCase().includes(q))return false;if(S.chips.has("old")&&x.days<=30)return false;if(S.chips.has("mem")&&!/MEMORY|HARNESS/.test(x.rel))return false;if(S.chips.has("claude")&&!x.rel.endsWith("CLAUDE.md"))return false;return true;});
 const g={};sel.forEach(x=>(g[x.project]=g[x.project]||[]).push(x));const ps=Object.keys(g).sort((p,r)=>(p==="global")-(r==="global")||p.localeCompare(r));
 $("rows").innerHTML=ps.map(p=>`<div class="grp"><span>${esc(p)}</span>${work.has(p)?`<span style="color:var(--amber)">${T("agentWorking")}</span>`:""}</div>`+g[p].sort((x,y)=>x.rel.localeCompare(y.rel)).map(x=>{const key=x.project+"::"+x.rel;const kb=x.bytes>1024?(x.bytes/1024).toFixed(0)+" KB":x.bytes+" B";return `<button class="row ${S.sel===key?"sel":""}" data-k="${esc(key)}"><span class="dot d-${x.days>30?"warnings":"valid"}"></span><span class="n">${esc(x.rel)}</span><span class="w">${x.days===0?T("today"):x.days+" d"} · ${kb}</span></button>`;}).join("")).join("")||`<div class="empty">${T("nothing")}</div>`;
 document.querySelectorAll(".row").forEach(r=>r.onclick=()=>openDoc(r.dataset.k));const old=a.filter(x=>x.days>30).length;
 $("foot").textContent=T("docsFoot",{s:sel.length,n:a.length,p:ps.length})+(old?" "+T("oldFoot",{n:old}):"")+(work.size?" "+T("blockedFoot",{p:[...work].join(", ")}):"");
 if(!S.sel)$("detail").innerHTML=`<div class="muted">${T("pickDoc")}</div>`;}
async function openDoc(key){if(S.editing&&!confirm(T("discard")))return;S.editing=false;S.sel=key;renderDocs();const [project,rel]=key.split("::");$("detail").innerHTML=`<div class="muted">${T("loading")}</div>`;
 const r=await GET(`/api/doc?project=${encodeURIComponent(project)}&rel=${encodeURIComponent(rel)}`);if(!r.ok){$("detail").innerHTML=`<div class="box bad">${esc(r.message)}</div>`;return;}S.doc={project,rel,...r};S.docVersions=null;S.docVersionSel=null;S.docVersionDetail=null;renderDocRead();}
function renderDocRead(){const d=S.doc;if(!d)return;$("detail").innerHTML=`<div class="h">${esc(d.rel.split("/").pop())} <span class="pill p-document">${esc(d.project)}</span></div><div class="meta"><span>${T("path")}</span><b><code>${wbr(esc(d.path))}</code></b><span>${T("modified")}</span><b>${esc(d.mtime)} · ${d.days===0?T("today"):d.days+" "+T("days")}${d.days>30?` <span style="color:var(--amber)">${T("maybeStale")}</span>`:""}</b><span>${T("size")}</span><b>${d.content.split("\n").length} ${T("lines")}</b></div>`+
 (d.blocked?`<div class="box warn">${T("blockedMsg",{p:esc(d.project)})}</div>`:"")+`<pre class="doc">${esc(d.content)}</pre><div class="actions"><button class="btn primary" id="bEdit" ${d.blocked?"disabled":""}>${T("edit")}</button><button class="btn" id="bExt">${T("openExt")}</button><button class="btn" id="bReload">${T("reload")}</button></div>`+
 (!HUB?`<div id="vPanel" class="muted">${esc(T("loading"))}</div>`:"");
 $("bEdit").onclick=()=>renderDocEdit();$("bExt").onclick=async()=>{toast((await POST("/api/open",{path:d.path})).message);};$("bReload").onclick=()=>openDoc(S.sel);
 if(!HUB)loadDocVersions(d,S.sel);}
async function loadDocVersions(d,key){if(HUB)return;
 let v;
 try{v=await GET(`/api/doc-versions?project=${encodeURIComponent(d.project)}&rel=${encodeURIComponent(d.rel)}`);}
 catch(e){if(S.sel!==key)return;const el0=$("vPanel");if(el0){el0.className="box bad";el0.innerHTML=esc(T("dvLoadError"));}return;}
 if(S.sel!==key)return;
 S.docVersions=v.versions;renderVPanel();}
function diffLineHtml(diff){return diff.split("\n").map(l=>{const el=esc(l);const cls=l.startsWith("+")&&!l.startsWith("+++")?"dl-add":l.startsWith("-")&&!l.startsWith("---")?"dl-del":l.startsWith("@@")?"dl-hunk":"";return cls?`<span class="${cls}">${el}</span>`:el;}).join("\n");}
function renderVPanel(){const el=$("vPanel");if(!el)return;const vs=S.docVersions;
 if(vs===null){el.className="muted";el.innerHTML=esc(T("loading"));return;}
 if(!vs.length){el.className="";el.innerHTML="";return;}
 const ambiguous=vs.some(x=>x.ambiguous);
 let html=(ambiguous?`<div class="box warn" style="margin-bottom:8px">${esc(T("dvAmbiguous"))}</div>`:"")+
  `<b>${esc(T("dvTitle"))}</b><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">`+
  vs.map(x=>`<button class="btn ${S.docVersionSel===x.stamp?"on":""}" data-stamp="${esc(x.stamp)}" style="text-align:left">${esc(fmtDT(x.iso))} · ${x.size} B</button>`).join("")+`</div>`;
 if(S.docVersionSel){const dd=S.docVersionDetail;
  if(!dd)html+=`<div class="muted" style="margin-top:8px">${esc(T("loading"))}</div>`;
  else if(!dd.ok)html+=`<div class="box bad" style="margin-top:8px">${esc(dd.message)}</div>`;
  else{html+=`<pre class="doc" id="vDiff" style="margin-top:8px;max-height:none;overflow:visible">${dd.diff?diffLineHtml(dd.diff):esc(T("dvNoDiff"))}</pre>`+
   (dd.command?`<div class="muted" style="margin-top:6px">${esc(T("dvRestoreCmd"))}</div><div class="actions" style="margin-top:4px"><code id="vCmd" style="flex:1;overflow-wrap:anywhere">${esc(dd.command)}</code><button class="btn" id="bVCopy">${T("copy")}</button></div>`
    :`<div class="box warn" style="margin-top:6px">${esc(dd.command_reason||T("dvNoCommand"))}</div>`);}}
 el.className="box info";el.innerHTML=html;
 el.querySelectorAll("[data-stamp]").forEach(b=>b.onclick=()=>selectDocVersion(b.dataset.stamp));
 const bc=$("bVCopy");if(bc)bc.onclick=async()=>{
  try{await navigator.clipboard.writeText(S.docVersionDetail.command);toast(T("copied"));}
  catch(e){const rg=document.createRange();rg.selectNodeContents($("vCmd"));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);}};}
async function selectDocVersion(stamp){const d=S.doc;if(!d)return;const key=S.sel;
 S.docVersionSel=stamp;S.docVersionDetail=null;renderVPanel();
 let r;
 try{r=await GET(`/api/doc-version?project=${encodeURIComponent(d.project)}&rel=${encodeURIComponent(d.rel)}&stamp=${encodeURIComponent(stamp)}`);}
 catch(e){if(S.sel!==key||S.docVersionSel!==stamp)return;S.docVersionDetail={ok:false,message:T("dvLoadError")};renderVPanel();return;}
 if(S.sel!==key||S.docVersionSel!==stamp)return;
 S.docVersionDetail=r;renderVPanel();}
function renderDocEdit(){const d=S.doc;S.editing=true;$("detail").innerHTML=`<div class="h">${esc(d.rel.split("/").pop())} <span class="pill p-warnings">${T("editing")}</span></div><div class="muted">${T("editHint")}</div><textarea class="editor" id="ta" spellcheck="false">${esc(d.content)}</textarea><div id="msg"></div><div id="cbDoc"></div><div class="actions"><button class="btn primary" id="bSave">${T("save")}</button><button class="btn" id="bCancel">${T("cancel")}</button></div>`;commitBox("cbDoc",d.path);
 $("bCancel").onclick=()=>{S.editing=false;renderDocRead();};$("bSave").onclick=async()=>{const nv=$("ta").value;if(nv===d.content){toast(T("noChanges"));S.editing=false;renderDocRead();return;}$("bSave").disabled=true;$("bSave").textContent=T("saving");
  const r=await POST("/api/save-doc",{project:d.project,rel:d.rel,content:nv,hash:d.hash});if(r.ok){toast(r.message);await maybeCommit("cbDoc",d.path,`project-os: edit ${d.rel} (${d.project})`);S.editing=false;await loadDocs();openDoc(S.sel);}else{$("bSave").disabled=false;$("bSave").textContent=T("save");$("msg").innerHTML=`<div class="box bad">${esc(r.message)}${r.conflict?` <button class="btn" id="bSee" style="margin-left:8px">${T("seeCurrent")}</button>`:""}</div>`;if(r.conflict)$("bSee").onclick=()=>{if(confirm(T("loseEdit"))){S.editing=false;openDoc(S.sel);}};}};}
// ---------- LIVE ----------
function renderLive(){const l=S.live;$("filters").innerHTML=`<span class="muted">${l&&l.ok?T("liveHint",{p:l.provider}):T("noLive")}</span>`;
 if(!l||!l.ok){$("rows").innerHTML=`<div class="empty">${esc(l?.reason||T("noLive"))}</div>`;$("foot").textContent="";$("detail").innerHTML=`<div class="muted">${T("noLive")}</div>`;return;}const ico={working:"●",done:"✓",idle:"○"};
 $("rows").innerHTML=l.agents.length?l.agents.map(a=>`<button class="row" data-p="${esc(a.pane)}"><span class="dot d-${a.status}"></span><span class="n">${idSwatch(a.agent)}${esc(a.agent)} <span class="muted">${esc(a.workspace)}</span></span><span class="w">${esc(a.task||"—")}</span></button>`).join(""):`<div class="empty">${T("noAgents")}</div>`;
 document.querySelectorAll(".row").forEach(r=>r.onclick=async()=>{toast((await POST("/api/focus",{pane:r.dataset.p})).message);});const c={};l.agents.forEach(a=>c[a.status]=(c[a.status]||0)+1);
 $("foot").textContent=T("inWs",{n:l.agents.length,w:l.workspaces.length})+" · "+Object.entries(c).map(([k,v])=>`${ico[k]||"·"} ${v} ${T(k)}`).join("  ");const done=l.agents.filter(a=>a.status==="done");
 $("detail").innerHTML=done.length?`<div class="h">${T("waitReview")}</div>`+done.map(a=>`<div class="box warn"><b>${esc(a.agent)}</b> · ${esc(a.workspace)}<br>${esc(a.task||"—")}</div>`).join(""):`<div class="muted">${T("noneDone")}</div>`;}
loadAgents();loadHub();
if(!HUB){loadLive();let liveN=0;setInterval(()=>{if(document.hidden)return;liveN++;if(S.view==="live"||liveN%5===0)loadLive();},1000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadLive();});
 fetchScanStatus().then(updateScanUI);}
ensureLoaded(S.view);
</script></body></html>
